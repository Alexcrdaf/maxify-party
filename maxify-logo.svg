<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bottomShadowGlow" x="-20%" y="20%" width="140%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.75"/>
      <feComposite in2="blur" operator="in"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="squircleBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Ground Bottom Ambient Glow under the icon -->
  <ellipse cx="32" cy="54" rx="20" ry="7" fill="#9333ea" opacity="0.85" filter="url(#bottomShadowGlow)"/>

  <!-- Squircle Base Frame with Smooth Corner Radius -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#squircleBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2"/>

  <!-- Paper Plane / Arrow M Icon from screenshot -->
  <g transform="translate(14, 13)">
    <!-- Base stylized paper airplane shape -->
    <path d="M4 17 L30 4 L19 32 L15 20 Z" fill="url(#arrowGrad)"/>
    <!-- Central white stroke 'M' calligraphic crest -->
    <path d="M8 23 L13 14 L17 21 L22 11 L27 6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle bottom speed streaks -->
    <path d="M5 26 L11 23" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
